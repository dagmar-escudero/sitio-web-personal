<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Dagmar Escudero</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header class="encabezado">
        <div id="logo">DEG</div>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre-mi.html">Sobre mí</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="portafolio.html">Portafolio</a></li>
                <li><a href="contacto.html" class="activo">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contacto</h1>
        <p class="intro">¿Tienes un proyecto en mente? Escríbeme y con gusto te respondo.</p>

        <section class="contacto">
            <div class="datos-contacto">
                <img src="mapa.png" alt="Mapa con la ubicación aproximada">
                <p><img class="ico" src="ic-ubicacion.svg" alt="">Dirección: Cuernavaca, Morelos</p>
                <p><img class="ico" src="ic-correo.svg" alt="">Correo: contacto@dagmarescudero.com</p>
                <p><img class="ico" src="ic-telefono.svg" alt="">Teléfono: 777 000 0000</p>
            </div>

            <form class="formulario">
                <input type="text" name="nombre" placeholder="Tu nombre">
                <input type="email" name="correo" placeholder="Tu correo electrónico">
                <textarea name="comentarios" rows="5" placeholder="Escribe tus comentarios"></textarea>
                <button type="submit" class="boton-cta">Enviar</button>
            </form>
        </section>
    </main>

    <footer class="pie">
        <div>
            <a href="https://www.facebook.com" target="_blank"><img class="ico" src="ic-facebook.svg" alt="">Facebook</a>
            <a href="https://www.instagram.com" target="_blank"><img class="ico" src="ic-instagram.svg" alt="">Instagram</a>
        </div>
        <div>© 2026 Dagmar Escudero</div>
    </footer>
</body>
</html>
